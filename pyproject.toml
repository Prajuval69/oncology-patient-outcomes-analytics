[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "oncology-outcomes-platform"
version = "1.0.0"
description = "Synthetic oncology patient outcomes and treatment pathway analytics platform"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2", "statsmodels>=0.14,<0.15",
  "lifelines>=0.30,<0.31", "matplotlib>=3.8,<4",
  "seaborn>=0.13,<0.14", "plotly>=5.20,<7",
  "streamlit>=1.35,<2", "shap>=0.45,<1", "joblib>=1.3,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

